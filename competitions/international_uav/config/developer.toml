# The DEV tab: running the vehicle software on the companion Pis over SSH,
# and checking every link the mission uses.
#
# Two kinds of vehicle: the swarm agents (Raspberry Pi 4, reached over wifi)
# and the Pasifik (Raspberry Pi 5, reached over ethernet through the Rocket
# pair, or over wifi on the bench). Every node is a transient systemd unit, so
# it keeps running when this window, the SSH connection or the whole laptop
# goes away, and its output is read back out of the journal.

[developer]
ssh_program = "ssh"
# Nothing in a tab can answer a password prompt or a host key question, so ssh
# is told never to ask: it fails with a message instead of hanging forever. The
# connect timeout is what makes a Pi that is off report back in seconds.
ssh_options = ["-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=accept-new", "-o", "ConnectTimeout=5"]
# Windows cannot ask a console process to close, so a monitor that is still
# alive this long after being asked is killed.
stop_wait_ms = 200
# How the open monitors are laid out, and how short one may be drawn. Two
# columns means the four vehicles stack two deep, so the floor is what decides
# whether the bottom row still fits on the screen: it is low enough for all
# four to be seen whole on a laptop panel, and only reached when they are.
monitor_columns = 2
monitor_min_height = 110
# How often every vehicle is asked whether its unit is running, so "is it
# running?" does not need a monitor open. A vehicle whose last question has not
# been answered yet is not asked again.
status_poll_ms = 5000

[developer.pasifik]
# How the tab reaches the Pi: "rocket" dials the Pi's wired address through the
# Rocket pair, "wifi" its name on the lab wifi. This is separate from
# link.connection in vtol/config/general.yaml, which is how the Pasifik reaches
# the ground station: on the bench both are wifi, on the field both are rocket,
# and during a radio test SSH can stay on wifi while the mission link is on the
# Rockets.
ssh_connection = "rocket"
rocket_host = "cezeri@192.168.1.104"
wifi_host = "cezeri@pasifik.local"
repository_path = "/home/cezeri/International-UAV-2026"
app = "vtol"
unit_name = "pasifik"

[developer.agents]
# Agent 2 runs on cezeri@rpi2.local, and so on for every id.
host_pattern = "cezeri@rpi{drone_id}.local"
repository_path = "/home/cezeri/International-UAV-2026"
app = "drone"
unit_name = "drone"

# What runs on this laptop rather than on a Pi: the ground station always, and
# the agents and the Pasifik when SIMULATION is ticked, because SITL and the
# UDP mesh both live here. Paths are relative to the UI root. Each app's venv
# interpreter is used when it exists and the fallback otherwise.
[developer.local]
fallback_python = "python"
script = "main.py"
# Unbuffered, or a node's output sits in a pipe and arrives in bursts; UTF-8,
# or a Windows python writes the console codepage and the tab misreads it.
environment = { PYTHONUNBUFFERED = "1", PYTHONIOENCODING = "utf-8" }
# Every START writes the SIMULATION box into this line of these files first,
# so the laptop is never left in the wrong mode by accident. The Pis are not
# touched: their checkout stays on real hardware.
simulation_files = ["../International-UAV/computer/config/general.yaml", "../International-UAV/drone/config/general.yaml", "../International-UAV/vtol/config/general.yaml"]
simulation_pattern = "^simulation_mode: .*$"
simulation_line = "simulation_mode: {value}"

# Keyed by the app name a vehicle carries (developer.agents.app and
# developer.pasifik.app), plus the ground station.
[developer.local.computer]
directory = "../International-UAV/computer"
python = "../International-UAV/computer/venv/Scripts/python.exe"

[developer.local.drone]
directory = "../International-UAV/drone"
python = "../International-UAV/drone/venv/Scripts/python.exe"

[developer.local.vtol]
directory = "../International-UAV/vtol"
python = "../International-UAV/vtol/venv/Scripts/python.exe"

# PUSH TO PI sends the branch checked out on this laptop straight into the Pi's
# own checkout over ssh. It is how a board with no way out to GitHub is
# updated -- a field wifi, or the Pasifik on the Rocket link -- where GIT PULL
# has nothing to talk to. Both vehicles run the same repository, so there is
# one copy on this laptop to push from; the directory is relative to the UI
# root, as everywhere else here.
[developer.push]
git_program = "git"
directory = "../International-UAV"
# The Pi's git is told to move its working tree along with the branch, so the
# push lands the way a pull would. A Pi holding uncommitted edits refuses the
# push and keeps them; GIT RESTORE is what throws those away.
#
# updateinstead is lowercase on purpose. git matches that word without caring
# about case, but it asks the system to do the folding, and a Pi running in
# Turkish folds a capital I to the dotless one. The word then matches nothing
# and the push dies on the Pi with a bad boolean value.
arguments = [
    "push",
    "--receive-pack=git -c receive.denyCurrentBranch=updateinstead receive-pack",
    "{host}:{repository}",
    "HEAD",
]
# git starts an ssh of its own, and that one would be free to ask for a
# password or a host key nothing in a tab can answer. This hands it the same
# ssh, with the same options, as every other command here.
ssh_variable = "GIT_SSH_COMMAND"

[developer.commands]
# The venv interpreter by full path: systemd-run starts with a bare
# environment, and the system python has none of the dependencies. Without
# PYTHONUNBUFFERED the live journal stays empty for minutes at a time. The
# arguments are the agent's id for an agent and nothing for the Pasifik.
start = "systemd-run --user --unit={unit} --collect --working-directory={repository}/{app} -E PYTHONUNBUFFERED=1 {repository}/{app}/venv/bin/python main.py {arguments}"
stop = "systemctl --user stop {unit}"
# Prints active, inactive or failed; the status pills are drawn from it.
is_active = "systemctl --user is-active {unit}"
# -o cat drops journald's own timestamp so the node's log line stays readable.
# stdbuf keeps the output line by line: nothing here is a terminal, and a
# journal written into a pipe would otherwise arrive in silent 4 KB bursts.
monitor = "stdbuf -oL journalctl --user-unit={unit} -f -o cat"
pull = "cd {repository} && git pull --ff-only"
# Throws away every edit made on the Pi, so a checkout or pull can go through
# again. Files added by hand and the branch itself stay as they are.
restore = "cd {repository} && git restore ."
checkout = "cd {repository} && git fetch --prune && git checkout {branch} && git pull --ff-only"
# The reboot is queued three seconds out rather than run straight away: a
# board that reboots under the connection takes sshd with it, and the tab
# would report a failure for a reboot that worked.
reboot = "{sudo} systemd-run --on-active=3 --collect systemctl reboot"
# How that command gets root. With no password set the first form is used, and
# -n makes a Pi that wants one say so instead of waiting for a prompt nobody
# can answer; with a password set the second pipes it in. The password itself
# is never written here — this file is in git. Put it in secrets.toml next to
# this one, which is not:
#
#     [developer]
#     sudo_password = "the password"
#
sudo_prefix = "sudo -n"
sudo_prefix_with_password = "echo {password} | sudo -S -p ''"
# The Pasifik's wifi, asked before a pull or checkout: which devices are up,
# whether there is a way out to the internet, and the addresses it has.
wifi_state = "nmcli -t -f DEVICE,STATE dev status; echo '## connectivity'; nmcli networking connectivity check; echo '## addr'; ip -br addr"
wifi_scan = "nmcli -t -f SSID,SIGNAL,SECURITY dev wifi list --rescan yes"
wifi_connect = "nmcli dev wifi connect {ssid} password {password}"
wifi_connect_open = "nmcli dev wifi connect {ssid}"
connectivity = "nmcli networking connectivity check"

[developer.wifi]
# How long CONNECT waits for nmcli to report a way out, asking this often.
connect_timeout_ms = 30000
poll_interval_ms = 1000
# What nmcli prints when the internet is reachable, and the device and state
# it names when the wifi is up.
connectivity_full = "full"
wlan_device = "wlan0"
ethernet_device = "eth1"
connected_state = "connected"
# Terse nmcli output separates fields with this.
field_separator = ":"
# The marker each section of a multi-command answer starts with.
section_marker = "## "

[developer.network]
# Every address the PING TEST looks at. Must match docs/network_setup.md, the
# Pi's nmcli profiles and vtol/config/general.yaml on the aircraft.
rocket_subnet_prefix = "192.168.1."
camera_subnet_prefix = "192.168.144."
rocket_ground = "192.168.1.102"
rocket_air = "192.168.1.101"
pasifik_pi = "192.168.1.104"
siyi_camera = "192.168.144.25"
# The Rocket link's port and the ESP bridge's serial port on this laptop. Both
# must match computer/config/ (rocket.yaml and general.yaml).
rocket_port = 5005
esp_port = "COM17"
ping_count = 4
ping_timeout_s = 1
# What this laptop runs; every entry is one process.
gcs_ping = ["ping", "-n", "{count}", "-w", "{timeout_ms}", "{address}"]
gcs_addresses = ["ipconfig"]
gcs_neighbours = ["arp", "-a"]
gcs_rocket_clients = ["netstat", "-ano", "-p", "tcp"]
gcs_serial_ports = ["powershell", "-NoProfile", "-Command", "[System.IO.Ports.SerialPort]::GetPortNames()"]
# Windows prints TTL= on every reply whatever the language, and the time in
# the language of the machine; Linux ping prints time=x ms.
gcs_reply_pattern = "TTL="
gcs_time_pattern = "(?:time|süre|zaman)[=<]([0-9]+)\\s*ms"
gcs_established_text = "ESTABLISHED"
pi_time_pattern = "time=([0-9.]+) ms"
pi_reply_pattern = "ttl="
# What the Pi runs, in one ssh call, each part behind a marker line so the
# answer can be cut back into parts. The laptop's actual Rocket-subnet address
# is filled in from ipconfig first; the address the Pasifik dials is read off
# its own config on the Pi.
pi_ping = "ping -c {count} -W {timeout} {address}"

[developer.network.pi_commands]
addr = "ip -br addr"
config = "grep -E '^ *(connection|address_rocket|address_wifi):' {repository}/{app}/config/general.yaml"
rocket_ground = "ping -c {count} -W {timeout} {rocket_ground}"
rocket_air = "ping -c {count} -W {timeout} {rocket_air}"
laptop_dialled = "dialled=$(sed -n 's/^ *address_rocket: *\"\\(.*\\)\".*/\\1/p' {repository}/{app}/config/general.yaml); echo \"$dialled\"; ping -c {count} -W {timeout} \"$dialled\""
laptop_actual = "ping -c {count} -W {timeout} {laptop_address}"
camera = "ping -c {count} -W {timeout} {siyi_camera}"
neigh = "ip neigh"
rocket = "ss -tn | grep ':{rocket_port} ' || true"

[developer.diagnosis]
# Loss above these, in the link test, is worth a sentence.
loss_warning_percent = 5.0
mesh_loss_warning_percent = 10.0
no_ping_test = "Run a PING TEST first; DIAGNOSE reads its table."
all_clear = "Nothing to report: every address answered and every link carried its probes."
no_rocket_address = "The laptop is not on the Rocket network: its addresses are {addresses} and none is {prefix}x. Check the cable and the adapter, and that the ground Rocket is powered."
ground_rocket_silent = "The ground Rocket at {address} is not answering although the laptop is on {laptop_address}. Check the PoE injector and the cable to the ground unit."
rockets_not_linked = "The two Rockets are not linked: the ground unit answers and the air unit at {address} does not. Check the air unit's power and that both are on the same SSID and channel."
pasifik_pi_silent = "The Pasifik's Pi is not answering on {address}. It may be off, still booting, or its address is not the one in developer.toml."
pi_unreachable_by_ssh = "The Pasifik's Pi answers pings but ssh to {host} failed: {reason}"
camera_adapter_missing = "The camera adapter is missing on the Pi or has no {prefix}x address: its interfaces are {addresses}."
camera_silent = "The camera at {address} is not answering from the Pi — check its power and cable."
ground_address_mismatch = "The ground station address is different: the Pasifik dials {dialled}, which does not answer, and the laptop is at {actual}, which does. Change link.address_rocket in vtol/config/general.yaml or set the laptop's address."
pasifik_node_not_connected = "The Pi pings fine but the Rocket server has no client: the Pasifik node is not running, or it is dialling the wrong network — link.connection on the Pi is {connection}."
rocket_link_lossy = "The Rocket link is dropping packets ({loss:.0f} % lost in the link test)."
agent_unreachable = "Drone {agent_id} is not on the wifi or its hostname is not {host} — check with the Pi's screen or hostnamectl."
esp_bridge_missing = "The ESP bridge on {port} is not there; unplug and replug it, and check serial.port in computer/config/general.yaml."
agent_mesh_lossy = "Drone {agent_id} hears the mesh badly ({loss:.0f} % loss); move it or change the channel."
broker_lossy = "The broker on this laptop is dropping messages ({loss:.0f} % lost); check that mosquitto is running and not another instance."

# The nodes log through colorlog, so every journal line arrives wrapped in the
# escape codes of its level's colour. The codes are taken off the line and the
# level is repainted from the design tokens; these are the colours colorlog is
# configured with, as the states they stand for.
[developer.log_states]
"31" = "critical"
"32" = "ok"
"33" = "caution"
"36" = "info"

