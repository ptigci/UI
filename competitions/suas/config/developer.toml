all_clear = "Nothing to report: every address answered and every link carried its probes."
no_rocket_address = "The laptop is not on the Rocket network: its addresses are {addresses} and none is {prefix}x. Check the cable and the adapter, and that the ground Rocket is powered."
ground_rocket_silent = "The ground Rocket at {address} is not answering although the laptop is on {laptop_address}. Check the PoE injector and the cable to the ground unit."
rockets_not_linked = "The two Rockets are not linked: the ground unit answers and the air unit at {address} does not. Check the air unit's power and that both are on the same SSID and channel."
pi_silent = "The VTOL's Pi is not answering on {address}. It may be off, still booting, or its address is not the one in developer.toml."
pi_unreachable_by_ssh = "The VTOL's Pi answers pings but ssh to {host} failed: {reason}"
camera_adapter_missing = "The camera adapter is missing on the Pi or has no {prefix}x address: its interfaces are {addresses}."
camera_silent = "The camera at {address} is not answering from the Pi. Check its power and cable."
ground_address_mismatch = "The ground station address is different: the aircraft dials {dialled}, which does not answer, and the laptop is at {actual}, which does. Change ground_host in vtol/config/link.toml or set the laptop's address."
vtol_node_not_connected = "The Pi pings fine but the Rocket server has no client: the vtol node is not running, or it is dialling the wrong network."
rocket_link_lossy = "The Rocket link is dropping packets ({loss:.0f} % of the probes were lost)."
probes_unanswered = "No probe came back: the ground services are not relaying, or the aircraft is not echoing suas/link/probe."
broker_disconnected = "This laptop is not connected to the broker; check that mosquitto is running on the ground services machine."
mission_link_down = "The aircraft has not been heard on the mission link recently; the vtol node may not be running or the Rocket line is down."
safety_link_down = "The safety link is down: no MAVLink heartbeat on the RFD900x port."

# The vtol node logs through colorlog, so every journal line arrives wrapped
# in the escape codes of its level's colour. The codes are taken off the line
# and the level is repainted from the design tokens; these are the colours
# colorlog is configured with, as the states they stand for.
[developer.log_states]
"31" = "critical"
"32" = "ok"
"33" = "caution"
"36" = "info"

