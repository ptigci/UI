sequence = "seq"
frame = "frame"
command = "command"
param1 = "param1"
param2 = "param2"
param3 = "param3"
param4 = "param4"
latitude = "latitude"
longitude = "longitude"
altitude_metres = "altitude_m"
autocontinue = "autocontinue"

[payloads.calibration_command]
# What goes out on suas/calibration/command.
command_id = "command_id"
calibration = "calibration"
action = "action"

[payloads.calibration_progress]
# Where a calibration is, on suas/calibration/progress. The step is the
# sentence the operator follows, the percent fills the bar, the detail is
# whatever number came with it.
calibration = "calibration"
state = "state"
step = "step"
percent = "percent"
detail = "detail"

[payloads.aircraft_bus]
# Every command on the three topics above carries the laptop's clock when it
# left, so the aircraft's log can be read against ours.
timestamp = "timestamp"

[codes.aircraft_command]
# What the FLIGHT card can ask of the aircraft itself. upload_mission is never
# sent as an action; it is the name the mission upload answers under.
arm = "arm"
force_arm = "force_arm"
force_disarm = "force_disarm"
start_mission = "start_mission"
set_mode = "set_mode"
upload_mission = "upload_mission"

[codes.flight_mode]
# The modes set_mode may ask for, by ArduPlane's own names.
manual = "MANUAL"
auto = "AUTO"
qstabilize = "QSTABILIZE"
rtl = "RTL"
qrtl = "QRTL"
qland = "QLAND"

[codes.calibration]
# The calibrations the CALIBRATION tab can run, what it can do to one, and
# where one is. "waiting" means the aircraft waits for the operator's NEXT.
compass = "compass"
rc = "rc"
accel = "accel"
accel_simple = "accel_simple"
motors = "motors"

[codes.calibration_action]
start = "start"
next = "next"
cancel = "cancel"

[codes.calibration_state]
running = "running"
waiting = "waiting"
done = "done"
failed = "failed"
cancelled = "cancelled"
