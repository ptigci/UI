pitch_degrees = "pitch_deg"
roll_degrees = "roll_deg"
zoom = "zoom"
recording = "recording"
card_state = "card_state"
card_free_megabytes = "card_free_megabytes"
stream_up = "stream_up"
reason = "reason"

[payloads.camera_media_list]
