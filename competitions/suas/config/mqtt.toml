pitch_degrees = "pitch_deg"
zoom = "zoom"

[codes.gimbal_command]
point = "point"
centre = "centre"
zoom_to = "zoom_to"
stop = "stop"

[payloads.gimbal_state]
# What the camera says about itself. Every angle here is one it reported, not
