# The mission bus. Topics and payload field names live here and nowhere else.
# The aircraft side of the same contract is SUAS/vtol/shared/protocol/config/ —
# keep the two in step by hand until one of them becomes the single source.
# SUAS/tools/check_contract.py compares them.
#
# This application never talks to the aircraft. The broker it connects to is on
# the ground services machine (config/general.toml → broker_address), and
# SUAS/computer/relay is the only thing joined to both that broker and the
# aircraft's. So a topic here is a topic the ground services agreed to carry —
# `mapping_frame` is deliberately not one of them, because it is their input and
# nothing here draws it.
#
# RTL, LAND and flight termination are absent for a different reason: they go
# over the direct MAVLink link, never through a broker at all. See
# config/safety.toml.

[mqtt.topics.subscribe]
telemetry = "suas/telemetry/state"
waypoint = "suas/telemetry/waypoint"
mission_state = "suas/mission/state"
target_detected = "suas/target/detected"
target_track = "suas/target/track"
target_blacklist = "suas/target/blacklist"
payload_state = "suas/payload/state"
release_countdown = "suas/payload/countdown"
camera_state = "suas/camera/state"
video_frame = "suas/video/frame"
mapping_progress = "suas/mapping/progress"
stitch_state = "suas/stitch/state"
route_plan = "suas/route/plan"
health_link = "suas/health/link"
health_system = "suas/health/system"
command_ack = "suas/command/ack"
# What the autopilot says in words: a refused arm, a fence breach, every
# "Mission: ..." line. Then the answer to an aircraft command or a mission
# upload once the outcome is known, and where a running calibration is.
statustext = "suas/telemetry/statustext"
command_result = "suas/command/result"
calibration_progress = "suas/calibration/progress"
# The DEV tab's link test: the aircraft echoes each probe back through the
# ground services.
link_probe_reply = "suas/link/probe_reply"
# The TEST tab. Where the gimbal is looking, what is on the camera's card
# and how a copy of it is going, where each release servo was left, and
# which waypoint armed the scan.
gimbal_state = "suas/gimbal/state"
camera_media_list = "suas/camera/media_list"
camera_media_chunk = "suas/camera/media_chunk"
camera_transfer = "suas/camera/transfer"
payload_servo = "suas/payload/servo"
waypoint_watch = "suas/mission/waypoint_watch"
# What the detector is doing, and every sighting it makes. A sighting is
# not a detection card: a card is a fused track the aircraft is ready to
# deliver on, and this is one frame the model scored.
detector_state = "suas/detector/state"
detector_sighting = "suas/detector/sighting"

[mqtt.topics.publish]
mission_command = "suas/command/mission"
flight_command = "suas/command/flight"
target_confirm = "suas/target/confirm"
target_designate = "suas/target/designate"
blacklist_clear = "suas/target/blacklist_clear"
payload_command = "suas/payload/command"
camera_command = "suas/camera/command"
mapping_request = "suas/mapping/request"
stitch_request = "suas/stitch/request"
mapping_export = "suas/mapping/export"
# The aircraft's own controls on the FLIGHT card: arm, a mode, start the
# mission. A mission exported from Mission Planner, item by item, to be
# uploaded. Start, step or cancel one calibration on the CALIBRATION tab.
# Every one is answered on command_ack first and on command_result after.
aircraft_command = "suas/command/aircraft"
mission_upload = "suas/mission/upload"
calibration_command = "suas/calibration/command"
# One probe of the DEV tab's link test.
link_probe = "suas/link/probe"
# The TEST tab: where to point the camera, and which two waypoints start
# and end the scan.
gimbal_command = "suas/gimbal/command"
waypoint_watch_command = "suas/mission/waypoint_watch_command"
# A drop on a place the operator names rather than a target the aircraft
# found: plan a route to it, look at it, then fly it.
route_command = "suas/route/command"
# The detection bench: which detector runs and how sure it has to be.
detector_command = "suas/detector/command"

[payloads.telemetry]
# These are the aircraft's spellings, from SUAS/vtol/shared/protocol/config/
# messages.toml. They carry their units because the wire is metric and this
# display is not -- see units.py. Do not "tidy" them: a name that does not match
# the aircraft's reads as an empty value on the judge's screen and nothing says
# why. tools/check_contract.py in the SUAS repository compares the two.
latitude = "latitude"
longitude = "longitude"
altitude_agl_metres = "altitude_agl_m"
altitude_amsl_metres = "altitude_amsl_m"
ground_speed_metres_per_second = "groundspeed_ms"
airspeed_metres_per_second = "airspeed_ms"
heading_degrees = "heading_deg"
mode = "flight_mode"
armed = "armed"
battery_voltage = "battery_voltage"
battery_percent = "battery_percent"
# Which of the two the figures came from: "pixhawk" is the autopilot's own
# estimate, "adc" is the Pi measuring the pack directly. It is shown because a
# silent failover from one to the other changes what the number is worth.
battery_source = "battery_source"
gps_fix = "gps_fix"
satellite_count = "satellites"

# Terrain clearance would need a rangefinder the aircraft does not carry.
# altitude_agl_m is the height above ground we actually have.
terrain_clearance_metres = "terrain_clearance_m"

[payloads.waypoint]
current_index = "waypoint_index"
total_count = "waypoint_count"
distance_metres = "distance_m"
acceptance_radius_metres = "acceptance_radius_m"

[payloads.mission]
state = "state"
# The aircraft's own one-line reason for the state it is in: which waypoint
# started the scan, which mode it was taken over in, why it stood down.
detail = "detail"
laps_completed = "laps_completed"
lap_waypoint_index = "lap_waypoint_index"
lap_valid = "lap_valid"
lap_invalid_reason = "lap_invalid_reason"
laps_locked = "laps_locked"
# Seconds flown since the takeoff, and what is left of the flight the second
# look at the unanswered targets may use. Missing until the aircraft has a clock.
flight_time_s = "flight_time_s"
flight_time_left_s = "flight_time_left_s"

[payloads.target]
# What the aircraft puts on suas/target/detected. These are OUR wire names --
# the shared review browser has its own vocabulary (config/interface.toml at the
# app root), and the controller translates between the two so neither has to
# know about the other.
track_id = "track_id"
target_class = "target_class"
confidence = "confidence"
latitude = "latitude"
longitude = "longitude"
image_base64 = "image_base64"
frame_timestamp = "frame_timestamp"
decision_state = "decision_state"
# The numbers the aircraft chooses by, shown on the card so the operator sees
# the same figures: how many frames saw it, the average score, the score under
# the configured rule, and which payload would go to it.
average_confidence = "average_confidence"
observation_count = "observation_count"
score = "score"
bound_station = "bound_station"

[payloads.track]
# Every fused target on suas/target/track, drawn on the map.
track_id = "track_id"
target_class = "target_class"
latitude = "latitude"
longitude = "longitude"
decision_state = "decision_state"
score = "score"

[payloads.blacklist]
# suas/target/blacklist: every zone a denial closed, as a list.
zones = "zones"

[payloads.blacklist_zone]
zone_id = "zone_id"
target_class = "target_class"
latitude = "latitude"
longitude = "longitude"
radius_metres = "radius_m"

[payloads.route]
# suas/route/plan: the route the aircraft is about to fly, drawn on the map.
route_id = "route_id"
track_id = "track_id"
target_class = "target_class"
release_style = "release_style"
waypoints = "waypoints"
hover_point = "hover_point"
release_point = "release_point"
length_metres = "length_m"
estimated_time_seconds = "estimated_time_s"
# Whether the route is still waiting to be looked at. A route to a place the
# operator named arrives as "proposed" and nothing moves until it is approved;
# a route the aircraft planned for a target it found is "approved" already,
# because nobody was asked.
state = "state"
reason = "reason"
station = "station"

[payloads.route_point]
latitude = "latitude"
longitude = "longitude"

[payloads.payload_state]
# suas/payload/state: the stations keyed by name.
stations = "stations"

[payloads.station]
target_class = "target_class"
state = "state"
released_track_id = "released_track_id"

[codes.target_decision_state]
# What the aircraft says about a track, spelled in SUAS/vtol/targets.
pending = "pending"
approved = "approved"
denied = "denied"
delivered = "delivered"

[codes.station_state]
loaded = "loaded"
armed = "armed"
spent = "spent"

[payloads.release_countdown]
# What the aircraft puts on suas/payload/countdown while a delivery is being set
# up. `mode` says which release is talking; everything else may be absent on a
# refusal that never got as far as measuring anything.
mode = "mode"
track_id = "track_id"
target_class = "target_class"
metres_to_release = "metres_to_release"
distance_to_target_metres = "distance_to_target_m"
throw_metres = "throw_m"
heading_error_degrees = "heading_error_deg"
release_allowed = "release_allowed"
reason = "reason"

[payloads.mission_command]
# What goes out on suas/command/mission.
command_id = "command_id"
action = "action"

[codes.mission_command]
# Mirrored from the aircraft's commands.toml [mission].
abort = "abort"
start_survey = "start_survey"
finish_survey = "finish_survey"

[payloads.flight_command]
# What goes back on suas/command/flight, one press at a time.
command_id = "command_id"
action = "action"
# Which bay a RELEASE press means. Each bay has its own servo, so the ground
# station has one button per bay. Left out of a press that does not name one,
# where the target being hovered over decides the bay instead.
station = "station"

[payloads.camera_state]
# Whether the aircraft is recording. It follows the frames the Pi writes to its
# own card, which is the copy the aircraft's software writes and can count --
# the A8 mini's card is asked for by the same press and is a toggle nobody can
# confirm. Retained, so this is also what a GCS started mid-flight is told the
# moment it subscribes.
#
# The aircraft sends a session id and two counters with it. Nothing here reads
# them yet; they are what a "3412 frames" line under the REC light would be
# drawn from.
recording = "recording"
reason = "reason"

[payloads.camera_command]
# Start or stop that recording, and everything the TEST tab's camera page asks
# for. `rate_hz` belongs to the photo timers; `file_names` names the files on
# the camera's card a fetch should copy.
command_id = "command_id"
action = "action"
rate_hz = "rate_hz"
file_names = "file_names"

[payloads.video_frame]
# One preview frame, published by the ground services and never by the
# aircraft. The full-rate downlink is UDP between the aircraft and that
# machine; this is the part that crosses to the interface.
image_base64 = "image_base64"
width = "width"
height = "height"
frame_timestamp = "frame_timestamp"

[codes.camera_command]
start_recording = "start_recording"
stop_recording = "stop_recording"

[payloads.stitch_request]
# What goes out on suas/stitch/request: a folder of recorded frames for the
# ground services to stitch. The path is read on their machine, not this one.
command_id = "command_id"
folder_path = "folder_path"

[payloads.stitch_state]
# How that stitch is going, published back by the ground services on
# suas/stitch/state. The picture is a shrunk preview; the full mosaic stays on
# their disk under `mosaic_path`.
state = "state"
reason = "reason"
folder_path = "folder_path"
frames_found = "frames_found"
frames_skipped = "frames_skipped"
# How far through the frames the stitch has got, resent while it runs. Both are
# absent until the first frame goes down, and a stitching backend that cannot
# count its way through the frames never sends them at all -- so the bar goes
# busy rather than empty when they are missing.
frames_placed = "frames_placed"
frames_to_place = "frames_to_place"
frames_used = "frames_used"
mosaic_path = "mosaic_path"
image_base64 = "image_base64"
# The live session: how many frames the ground has, and the clock. The
# ground says how long the stitch has run as of the message; the panel keeps
# counting from there.
frames_received = "frames_received"
started_at = "started_at"
elapsed_seconds = "elapsed_s"
export_path = "export_path"

[codes.stitch_state]
# What `state` may say, spelled in the ground services'
# SUAS/computer/config/folder_stitch.toml.
running = "running"
complete = "complete"
failed = "failed"
exported = "exported"

[payloads.command_ack]
# The aircraft's answer to a press, on suas/command/ack. `status` is the field
# that matters: a press that was sent and a press that was acted on are
# different facts, and only the aircraft knows which happened.
command_id = "command_id"
command = "command"
status = "status"
reason = "reason"

[codes.release_mode]
# Which release the countdown is describing, spelled as `mode` in the
# aircraft's SUAS/vtol/config/payload.toml.
winch = "winch"
parachute = "parachute"
ballistic = "ballistic"

[codes.command_ack]
# What the aircraft says about a press. "accepted" means it is being acted on
# now; "done" means a one-shot command finished; "rejected" comes with a reason.
accepted = "accepted"
done = "done"
rejected = "rejected"

[payloads.target_confirm]
# What goes back on suas/target/confirm.
track_id = "track_id"
decision = "decision"
operator_id = "operator_id"

[codes.target_decision]
# The two answers. The aircraft compares against "approve"; anything else is a
# denial, so these are not interchangeable with the button labels.
approve = "approve"
deny = "deny"

[payloads.link_probe]
# What goes out on suas/link/probe: a number to match the reply by and the
# laptop's clock when it left.
probe_id = "probe_id"
sent_at = "sent_at"

[payloads.link_probe_reply]
# The aircraft's echo on suas/link/probe_reply: the probe as sent, plus the
# aircraft's own clock when it saw it.
probe_id = "probe_id"
sent_at = "sent_at"
aircraft_time = "aircraft_time"

[payloads.link]
mission_link_up = "mission_link_up"
mission_link_loss_percent = "mission_link_loss_percent"
safety_link_up = "safety_link_up"
safety_heartbeat_age_ms = "safety_heartbeat_age_ms"

[codes.flight_command]
# The steps of the operator-driven delivery, mirrored from the aircraft's
# SUAS/vtol/shared/protocol/config/commands.toml. The aircraft compares the
# `action` field against these strings, so a spelling that drifts is a button
# that goes out, gets refused in the air, and looks from here like nothing
# happened.
#
# Arming, taking off and landing are deliberately not here: this application
# never arms the aircraft, and landing goes over the direct MAVLink link with
# RTL — see config/safety.toml.
#
# `hold` is not a step of the delivery. It is the press that clamps a loaded bay
# shut: the aircraft drives no servo when it starts up, so nothing holds the
# payload until this goes out. Every mode takes it, the winged one included.
goto_target = "goto_target"
release = "release"
hold = "hold"
finish = "finish"

[codes.mode]
# The lap only counts while the autopilot holds this mode (3.7).
autonomous = "AUTO"

[codes.camera_test_command]
# The TEST tab's camera page, mirrored from the aircraft's commands.toml
# [camera_test]. Two columns of the same four presses, because a picture can be
# kept in two places and they fail differently: `stream_*` is the 1080p RTSP
# picture the Pi reads and writes to its own card, `card_*` is the 4K microSD
# card inside the camera that the Pi never sees.
stream_start_video = "stream_start_video"
stream_stop_video = "stream_stop_video"
stream_take_photo = "stream_take_photo"
stream_start_photo_timer = "stream_start_photo_timer"
stream_stop_photo_timer = "stream_stop_photo_timer"
card_start_video = "card_start_video"
card_stop_video = "card_stop_video"
card_take_photo = "card_take_photo"
card_start_photo_timer = "card_start_photo_timer"
card_stop_photo_timer = "card_stop_photo_timer"
card_list_files = "card_list_files"
card_fetch_files = "card_fetch_files"
card_watch_on = "card_watch_on"
card_watch_off = "card_watch_off"
send_photos_on = "send_photos_on"
send_photos_off = "send_photos_off"
send_videos_on = "send_videos_on"
send_videos_off = "send_videos_off"

[payloads.gimbal_command]
